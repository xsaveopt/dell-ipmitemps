name: Release

# Tag a v*.*.* commit on main → build a source archive and publish a GitHub
# Release. Other branches/PRs just sanity-check the build.
on:
  push:
    branches: ["**"]
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: write

jobs:
  ci:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          shopt -s globstar nullglob
          for f in **/*.sh; do bash -n "$f"; done

  release:
    name: Publish GitHub release
    needs: ci
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tags must be cut from a commit already merged to main.
      - name: Verify tag is on main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not reachable from origin/main; refusing to publish."
            exit 1
          fi

      - name: Inject version into script
        run: sed -i "s/^VERSION=.*/VERSION=\"${GITHUB_REF_NAME}\"/" dellipmifanctl.sh

      - name: Create release archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          zip -r "dellipmifanctl-${TAG}.zip" . \
            --exclude '.git/*' \
            --exclude '.github/*'
          echo "ARCHIVE=dellipmifanctl-${TAG}.zip" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
